<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Order – Cool Cars</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ink: #fff;
        --glass: rgba(255, 255, 255, 0.26);
        --glass-line: rgba(255, 255, 255, 0.45);

        box-sizing: border-box;

        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      html {
        font-size: clamp(14px, 0.45vw + 9.5px, 24px);
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: Poppins, system-ui, sans-serif;
      }

      /* =========================
         PANEL UTAMA
      ========================= */

      .panels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.1rem;
        min-height: 100vh;
        max-width: 100rem;
        margin: 0 auto;
      }

      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.2rem;
      }

      /* =========================
         BACKGROUND
      ========================= */

      .mustang {
        background: radial-gradient(
          ellipse at 50% 42%,
          #8f9198 0%,
          #a5a7b0 40%,
          #b7bac5 100%
        );
      }

      .bmw {
        background: #9a4e5a;
      }

      .koe {
        background: radial-gradient(
          ellipse at 50% 45%,
          #7fb529 0%,
          #548620 50%,
          #375614 100%
        );
      }

      /* =========================
         LOGO
      ========================= */

      .logo-box {
        height: 13rem;
        width: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .logo {
        display: block;
        max-width: 76%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }

      .mustang .logo {
        max-width: 82%;
      }

      .koe .logo {
        max-height: 14rem;
        transform: scale(1.15);
      }

      .photo {
        display: block;
        width: 100%;
        height: 20rem;
        object-fit: contain;
        margin-top: 1.8rem;
        filter: drop-shadow(0 1rem 1rem rgba(0, 0, 0, 0.3));
      }

      .mustang .photo {
        transform: translateY(-1rem) scale(1.12);
      }

      /* =========================
         HARGA
      ========================= */

      .price {
        margin-top: 4.5rem;
        background: var(--glass);
        border: 1px solid var(--glass-line);
        border-radius: 0.9rem;
        padding: 0.8rem 1.4rem;
        font-size: 1.3rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        backdrop-filter: blur(0.3rem);
      }

      /* =========================
         BUTTON BUY
      ========================= */

      .buy {
        margin-top: 1.8rem;
        background: var(--glass);
        border: 1px solid var(--glass-line);
        border-radius: 999px;
        color: inherit;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 500;
        padding: 0.25rem 1.1rem;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
        text-decoration: none;
        display: inline-block;
      }

      .buy:hover {
        background: rgba(255, 255, 255, 0.42);
        transform: translateY(-2px);
        box-shadow: 0 0.4rem 1rem rgba(0, 0, 0, 0.18);
      }

      .buy:active {
        transform: translateY(0);
      }

      .buy:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      /* =========================
         ERROR IMAGE
      ========================= */

      img.empty {
        border: 2px dashed rgba(255, 255, 255, 0.55);
        border-radius: 0.75rem;
        min-height: 5rem;
        min-width: 10rem;
        padding: 0.5rem;
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.85rem;
        object-fit: none;
      }

      .photo.empty {
        min-height: 9rem;
      }

      /* =========================
         RESPONSIVE TABLET / HP
      ========================= */

      @media (max-width: 900px) {
        .panels {
          grid-template-columns: 1fr;
          gap: 0.9rem;
          min-height: 0;
        }

        .panel {
          padding: 2rem 1.2rem 2.4rem;
        }

        .logo-box {
          height: 10rem;
        }

        .photo {
          height: auto;
          max-width: 30rem;
        }

        .mustang .photo {
          transform: none;
        }

        .price {
          margin-top: 2rem;
        }

        .buy {
          margin-top: 1.2rem;
        }
      }
    </style>
  </head>

  <body>
    <main class="panels">
      <!-- =========================
           FORD MUSTANG
      ========================= -->

      <section class="panel mustang" aria-label="Ford Mustang">
        <div class="logo-box">
          <img
            class="logo"
            src="logo fm.png"
            alt="Ford Mustang"
            onerror="this.classList.add('empty')"
          />
        </div>

        <img
          class="photo"
          src="mustang_PNG40656.png"
          alt="Ford Mustang Shelby GT500"
          onerror="this.classList.add('empty')"
        />

        <div class="price">10.000.000.000</div>

        <!-- MENUJU HALAMAN ORDER MUSTANG -->
        <a class="buy" href="buyfm.html"> BUY </a>
      </section>

      <!-- =========================
           BMW M8
      ========================= -->

      <section class="panel bmw" aria-label="BMW M8">
        <div class="logo-box">
          <img
            class="logo"
            src="logo bmw.png"
            alt="BMW M"
            onerror="this.classList.add('empty')"
          />
        </div>

        <img
          class="photo"
          src="bmw.png"
          alt="BMW M8"
          onerror="this.classList.add('empty')"
        />

        <div class="price">7.700.000.000</div>

        <!-- MENUJU HALAMAN ORDER BMW -->
        <a class="buy" href="buybmw.html"> BUY </a>
      </section>

      <!-- =========================
           KOENIGSEGG JESKO ATTACK
      ========================= -->

      <section class="panel koe" aria-label="Koenigsegg Jesko Attack">
        <div class="logo-box">
          <img
            class="logo"
            src="logo koenigsegg.png"
            alt="Koenigsegg"
            onerror="this.classList.add('empty')"
          />
        </div>

        <img
          class="photo"
          src="koenigsegg.png"
          alt="Koenigsegg Jesko Attack"
          onerror="this.classList.add('empty')"
        />

        <div class="price">65.000.000.000</div>

        <!-- MENUJU HALAMAN ORDER KOENIGSEGG -->
        <a class="buy" href="buykoenigsegg.html"> BUY </a>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
