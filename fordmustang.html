<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ford Mustang – Cool Cars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #fff;
        --glass: rgba(255, 255, 255, 0.14);
        --glass-line: rgba(255, 255, 255, 0.3);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        font-size: clamp(14px, 0.45vw + 9.5px, 24px);
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: Poppins, system-ui, sans-serif;
        background: #444;
        background: radial-gradient(
            ellipse at 50% 38%,
            #a3a3a3 0%,
            #767676 38%,
            #454545 75%,
            #363636 100%
          )
          fixed;
      }
      .page {
        max-width: 85rem;
        margin: 0 auto;
        padding: 1.5rem 2.5rem 3rem;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      nav {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1rem;
      }
      nav a {
        color: inherit;
        text-decoration: none;
      }
      nav a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }
      .back,
      .next {
        font-weight: 600;
        font-size: 1.5rem;
        letter-spacing: 0.03em;
      }
      .next {
        text-align: right;
      }
      .menu {
        display: flex;
        gap: 2.5rem;
        font-size: 1rem;
      }
      .menu a {
        font-weight: 400;
      }
      .menu a.on {
        font-weight: 700;
      }
      .stage {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .logo {
        display: block;
        width: min(46rem, 64%);
        height: auto;
        object-fit: contain;
      }
      .photo {
        display: block;
        width: min(60rem, 76%);
        height: auto;
        margin: -7rem auto 0;
        position: relative;
        z-index: 1;
        transform: translateX(-4%);
        filter: drop-shadow(0 1.5rem 1.5rem rgba(0, 0, 0, 0.4));
      }
      .stats {
        position: absolute;
        right: 0;
        bottom: 2%;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.9rem;
        width: min(23rem, 34%);
      }
      .st {
        background: var(--glass);
        border: 1px solid var(--glass-line);
        border-radius: 0.9rem;
        padding: 0.9rem 0.6rem;
        text-align: center;
        backdrop-filter: blur(0.3rem);
      }
      .st b {
        display: block;
        font-size: 1.3rem;
        font-weight: 600;
        line-height: 1.1;
      }
      .st span {
        display: block;
        font-size: 0.78rem;
        font-weight: 400;
        opacity: 0.85;
        margin-top: 0.3rem;
      }
      img.empty {
        border: 2px dashed rgba(255, 255, 255, 0.5);
        border-radius: 0.75rem;
        min-height: 6rem;
        min-width: 12rem;
        padding: 0.5rem;
        color: rgba(255, 255, 255, 0.75);
        font-size: 0.85rem;
        object-fit: none;
      }
      .photo.empty {
        min-height: 16rem;
      }
      @media (max-width: 900px) {
        .page {
          padding: 1rem 1.1rem 2rem;
        }
        .back,
        .next {
          font-size: 1.1rem;
        }
        .menu {
          gap: 1rem;
          font-size: 0.8rem;
        }
        .logo {
          width: 84%;
        }
        .photo {
          width: 100%;
          margin-top: -2.5rem;
          transform: none;
        }
        .stats {
          position: static;
          width: 100%;
          margin-top: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav aria-label="Navigasi utama">
        <a class="back" href="index.html">BACK</a>
        <div class="menu">
          <a class="on" href="#">Vehicle</a>
          <a class="on" href="#">Order</a>
          <a href="#">About Us</a>
        </div>
        <a class="next" href="aboutusFordmustang.html">NEXT</a>
      </nav>

      <main class="stage">
        <img
          class="logo"
          src="logo fm.png"
          alt="Ford Mustang"
          onerror="this.classList.add('empty')"
        />
        <img
          class="photo"
          src="mustang_PNG40656.png"
          alt="Ford Mustang Shelby GT500"
          onerror="this.classList.add('empty')"
        />
        <div class="stats">
          <div class="st"><b>Top Speed</b><span>≈ 290–350 km/h</span></div>
          <div class="st"><b>Engine</b><span>Supercharged 5.2 V8</span></div>
          <div class="st"><b>847 Nm</b><span>5.000 rpm</span></div>
          <div class="st"><b>760 HP</b><span>Peak Power</span></div>
        </div>
      </main>
    </div>
  </body>
</html>
